environment: ${ENVIRONMENT}
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:notificationservice-sox}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: "health,info"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
api:
  rest:
    client:
      athssox:
        base-path: ${API_REST_CLIENT_ATHSSOX_BASE_PATH:http://authorisationservice-sox:9090/authsox}
      bffssox:
        base-path: ${API_REST_CLIENT_BFFSSOX_BASE_PATH:http://bffssox-service:8080/bffssox}
notification:
  messages:
    email-verification:
      allowedChannels: [ email ]
      delivery:
        email:
          link:
            url: https://app.sitionix.com/auth/email/verify
forge:
  security:
    service-id: sitionixNotification
    dev:
      jwt-secret: ${FORGE_SECURITY_DEV_JWT_SECRET:dev-internal-auth-secret}
      issuer: ${FORGE_SECURITY_DEV_ISSUER:sitionix-internal}
      ttl-seconds: ${FORGE_SECURITY_DEV_TTL_SECONDS:300}
    targets:
      sitionixAuth:
        host: ${FORGE_SECURITY_TARGETS_SITIONIXAUTH_HOST:authorisationservice-sox}
      sitionixBff:
        host: ${FORGE_SECURITY_TARGETS_SITIONIXBFF_HOST:bffssox-service}
